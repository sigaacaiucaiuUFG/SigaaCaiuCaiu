name: Monitor Sigaacaiu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  verificar_site:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Testar se o site está no ar (via API)
        run: |
          # URL do site visual
          URL_SITE="https://ufg.sigaacaiu.com" 
          # URL dos dados (API) que o site usa para saber se está online
          URL_API="https://ufg.sigaacaiu.com/api/status"
          
          # Pega os códigos de resposta do servidor
          STATUS_SITE=$(curl -o /dev/null -s -w "%{http_code}\n" $URL_SITE)
          STATUS_API=$(curl -o /dev/null -s -w "%{http_code}\n" $URL_API)
          
          # Hora atual
          DATA=$(TZ="America/Sao_Paulo" date +"%d/%m/%Y às %H:%M:%S")

          CAIU=false

          # 1. Se a interface visual explodir (diferente de 200, 301, 302)
          if [ "$STATUS_SITE" -ne 200 ] && [ "$STATUS_SITE" -ne 301 ] && [ "$STATUS_SITE" -ne 302 ]; then
            CAIU=true
          fi

          # 2. Se a API de dados explodir (é isso que causa o erro na tela que você viu!)
          if [ "$STATUS_API" -ne 200 ]; then
            CAIU=true
          fi

          # Grava o resultado no banco de dados (status.json)
          if [ "$CAIU" = true ]; then
            echo "{\"online\": false, \"ultima_verificacao\": \"$DATA\"}" > status.json
          else
            echo "{\"online\": true, \"ultima_verificacao\": \"$DATA\"}" > status.json
          fi

      - name: Salvar o novo status.json no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robô: Verificando via API"
          file_pattern: 'status.json'
