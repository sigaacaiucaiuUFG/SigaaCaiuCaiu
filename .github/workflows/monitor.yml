name: Monitor Sigaacaiu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  verificar_site:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Testar se o site está no ar e salvar histórico
        run: |
          URL_SITE="https://ufg.sigaacaiu.com" 
          URL_API="https://ufg.sigaacaiu.com/api/status"
          
          STATUS_SITE=$(curl -o /dev/null -s -w "%{http_code}\n" $URL_SITE)
          STATUS_API=$(curl -o /dev/null -s -w "%{http_code}\n" $URL_API)
          DATA=$(TZ="America/Sao_Paulo" date +"%d/%m/%Y às %H:%M:%S")

          CAIU=false

          if [ "$STATUS_SITE" -ne 200 ] && [ "$STATUS_SITE" -ne 301 ] && [ "$STATUS_SITE" -ne 302 ]; then
            CAIU=true
          fi

          if [ "$STATUS_API" -ne 200 ]; then
            CAIU=true
          fi

          # Define as variáveis para o JSON
          if [ "$CAIU" = true ]; then
            ONLINE="false"
            TXT="CAIU"
          else
            ONLINE="true"
            TXT="ONLINE"
          fi

          # Se o arquivo status.json não existir ou estiver vazio, cria uma base
          if ! jq -e . status.json >/dev/null 2>&1; then
            echo '{"online": false, "ultima_verificacao": "", "historico": []}' > status.json
          fi
          
          # A mágica do histórico: Adiciona no topo da lista e guarda só os últimos 10
          jq --arg date "$DATA" --arg txt "$TXT" --argjson on "$ONLINE" '
            .online = $on | 
            .ultima_verificacao = $date | 
            .historico = ([{"data": $date, "status": $txt}] + (.historico // []))[:10]
          ' status.json > temp.json && mv temp.json status.json

      - name: Salvar no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robô: Atualizando status e histórico"
          file_pattern: 'status.json'
